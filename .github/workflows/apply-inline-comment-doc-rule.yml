name: Apply Inline Comment Documentation Rule

on:
  push:
    paths:
      - ".github/workflows/apply-inline-comment-doc-rule.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/python-style-formatter

      - name: Apply documentation update
        run: python formatter/scripts/apply_inline_comment_doc_rule.py

      - name: Commit updated style guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document one-space inline comments"
          git push origin HEAD:feature/python-style-formatter
