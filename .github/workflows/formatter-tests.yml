name: Formatter Tests

on:
  pull_request:
    paths:
      - "formatter/**"
      - ".github/workflows/formatter-tests.yml"
  push:
    paths:
      - "formatter/**"
      - ".github/workflows/formatter-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: formatter/pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"
        working-directory: formatter

      - name: Run tests
        run: pytest | tee pytest-output.txt
        working-directory: formatter

      - name: Run Pyright
        run: pyright | tee pyright-output.txt
        working-directory: formatter

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatter-validation-output
          path: |
            formatter/pytest-output.txt
            formatter/pyright-output.txt
