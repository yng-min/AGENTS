[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yng-agents-tools"
version = "0.1.0"
description = "Repository impact analysis and documentation synchronization tools"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "yng-min" }
]
dependencies = []

[project.scripts]
agents-tools = "agents_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
