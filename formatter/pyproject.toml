[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yngmin-python-formatter"
version = "0.1.0"
description = "Python formatter for yngmin's Python Style Guide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=26.3.1",
    "libcst>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
yngfmt = "yngfmt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yngfmt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
